backend:
  name: github
  repo: sertugh/sertugh.github.io
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "articles"
    label: "ماقالىلەر"
    folder: "_posts"
    create: true
    fields:
      - {label: "ماقالە تېمىسى", name: "title", widget: "string"}
      - {label: "چېسلا", name: "date", widget: "datetime"}
      - {label: "تۈرى", name: "category", widget: "string"}
      - {label: "مەزمۇنى", name: "body", widget: "markdown"}
